<!DOCTYPE html>
<html lang="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title></title>
    <link href="css/travel.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <input type="checkbox" name="checkBox" id="checkBox">
    <div class="container d-flex justify-content-center align-items-center" style="height: 100vh;">
        <form class="w-100 bg-light rounded border overflow-hidden shadow" id="travelForm">
            <div class="row g-0">
                <div class="col text-center bg-primary text-white">
                    <h3>Insert travel</h3>
                </div>
            </div>
            <div class="p-3">
                <div class="row mb-3">
                    <div class="col">
                        <label class="form-label">Travel name: </label>
                        <input name="travelName" class="form-control" placeholder="Insert travel name">
                    </div>
                </div>
                <div class="row mb-4">
                    <div class="col">
                        <label class="form-label">Start date: </label>
                        <input type="date" name="startDate" class="form-control" placeholder="Insert start date">
                    </div>
                    <div class="col">
                        <label class="form-label">End date: </label>
                        <input type="date" name="endDate" class="form-control" placeholder="Insert end date">
                    </div>
                </div>
                <hr>
                <div class="row mb-4">
                    <div class="col">
                        <label class="form-label">Location name: </label>
                        <input name="locationName" class="form-control" placeholder="Insert location name">
                    </div>
                </div>
                <div class="row mb-4">
                    <div class="col">
                        <label class="form-label">Latitude: </label>
                        <input name="latitude" class="form-control" placeholder="Insert latitude">
                    </div>
                    <div class="col">
                        <label class="form-label">Longitude: </label>
                        <input name="longitude" class="form-control" placeholder="Insert longitude">
                    </div>
                </div>
                <div class="row">
                    <div class="col text-end">
                        <button type="submit" class="btn btn-primary">Submit</button>
                    </div>
                </div>
            </div>

        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="js/travel.js"></script>

</body>
</html>
